<!-- SUBSTITUA SOMENTE SUA PARTE DO SCRIPT DO CAROUSEL POR ISSO -->

<script>

/* CAROUSEL FIXO CENTRAL */

const carousel = document.getElementById('carousel')
const cards = document.querySelectorAll('.card')

let current = 0
let isAnimating = false

function updateCarousel(){

  cards.forEach(card=>{

    card.classList.remove('active')
    card.classList.remove('side')

  })

  cards[current].classList.add('active')

  const left =
  current - 1 < 0
  ? cards.length - 1
  : current - 1

  const right =
  current + 1 >= cards.length
  ? 0
  : current + 1

  cards[left].classList.add('side')
  cards[right].classList.add('side')

  const cardWidth =
  window.innerWidth <= 900
  ? 224
  : 288

  const wrapper =
  document.querySelector('.carousel-wrapper')

  const wrapperCenter =
  wrapper.offsetWidth / 2

  const translate =
  (current * cardWidth) - wrapperCenter + (cardWidth / 2)

  carousel.style.transform =
  `translateX(${-translate}px)`

}

/* iniciar */

updateCarousel()

/* próxima */

function nextCard(){

  if(isAnimating) return

  isAnimating = true

  current++

  if(current >= cards.length){

    current = 0

  }

  updateCarousel()

  setTimeout(()=>{

    isAnimating = false

  },450)

}

/* anterior */

function prevCard(){

  if(isAnimating) return

  isAnimating = true

  current--

  if(current < 0){

    current = cards.length - 1

  }

  updateCarousel()

  setTimeout(()=>{

    isAnimating = false

  },450)

}

/* SCROLL */

window.addEventListener('wheel',(e)=>{

  if(e.deltaY > 0){

    nextCard()

  }else{

    prevCard()

  }

})

/* MOBILE */

let touchStartX = 0
let touchEndX = 0

window.addEventListener('touchstart',(e)=>{

  touchStartX =
  e.changedTouches[0].screenX

})

window.addEventListener('touchend',(e)=>{

  touchEndX =
  e.changedTouches[0].screenX

  if(touchStartX - touchEndX > 50){

    nextCard()

  }

  if(touchEndX - touchStartX > 50){

    prevCard()

  }

})

window.addEventListener(
'resize',
updateCarousel
)

</script>
