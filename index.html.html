<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>DJ ORBITAL</title>

<link rel="icon"
href="https://i.scdn.co/image/ab6761610000e5eb2fbad6f69231d3d9cb2fb58c"
/>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#020202;
  color:white;
  font-family:'Orbitron',sans-serif;
  overflow:hidden;
  min-height:100vh;
  cursor:none;
  position:relative;
  touch-action:pan-y;
}

/* GIF FUNDO */

.bg-gif{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.16;
  z-index:-20;
  pointer-events:none;
}

/* GLOW */

.bg-glow{
  position:fixed;
  inset:0;
  background:
  radial-gradient(circle at center,
  rgba(255,0,90,.18),
  transparent 45%);
  z-index:-15;
}

/* STARS */

.stars{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:-10;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  opacity:.6;
  transition:transform .15s linear;
}

/* CURSOR */

.cursor{
  width:16px;
  height:16px;
  background:white;
  border-radius:50%;
  position:fixed;
  pointer-events:none;
  z-index:99999;
  transform:translate(-50%,-50%);
  box-shadow:
  0 0 10px white,
  0 0 30px white,
  0 0 60px white;
}

/* FUMAÇA */

.smoke{
  position:fixed;
  width:40px;
  height:40px;
  border-radius:50%;
  pointer-events:none;
  z-index:99998;

  background:
  radial-gradient(circle,
  rgba(255,255,255,.35),
  rgba(255,255,255,.1),
  transparent 70%);

  filter:blur(10px);

  animation:smoke .9s linear forwards;
}

@keyframes smoke{

  0%{
    opacity:.8;
    transform:
    translate(-50%,-50%)
    scale(.6);
  }

  100%{
    opacity:0;
    transform:
    translate(-50%,-50%)
    scale(2.5);
  }

}

/* MAIN */

.main{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:30px 20px 50px;
}

/* HERO */

.hero{
  text-align:center;
  margin-bottom:35px;
}

.profile{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ff004c;

  box-shadow:
  0 0 25px #ff004c,
  0 0 60px rgba(255,0,90,.5);
}

.logo{
  margin-top:18px;
  font-size:60px;
  font-weight:900;
  letter-spacing:4px;

  text-shadow:
  0 0 10px #ff004c,
  0 0 40px #ff004c;
}

.bio{
  width:750px;
  max-width:90%;
  margin-top:20px;
  padding:20px;
  border-radius:25px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,0,80,.2);
  backdrop-filter:blur(15px);
  font-size:13px;
  color:#ddd;
  line-height:1.7;
}

/* ===== CAROUSEL FIXO ===== */

.carousel-area{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.carousel-wrapper{
  width:930px;
  max-width:100%;
  overflow:hidden;
  position:relative;
}

.carousel{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:28px;
}

/* CARD */

.card{
  width:260px;
  min-width:260px;

  border-radius:28px;

  overflow:hidden;

  position:relative;

  background:
  linear-gradient(
  145deg,
  rgba(255,255,255,.06),
  rgba(255,255,255,.01));

  border:1px solid rgba(255,0,90,.25);

  backdrop-filter:blur(15px);

  transform-style:preserve-3d;

  transition:
  transform .35s ease,
  opacity .35s ease,
  filter .35s ease;

  box-shadow:
  0 20px 40px rgba(0,0,0,.6);
}

.card.side{
  transform:
  scale(.88)
  translateY(20px);

  opacity:.45;

  filter:blur(1px);
}

.card.active{
  transform:
  scale(1.05)
  translateY(-5px);

  opacity:1;

  z-index:5;

  box-shadow:
  0 0 35px rgba(255,0,90,.4),
  0 0 90px rgba(255,0,90,.15),
  0 25px 60px rgba(0,0,0,.8);
}

.card img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.content{
  padding:18px;
}

.music-title{
  font-size:13px;
  margin-bottom:15px;
  min-height:35px;
  letter-spacing:1px;
}

/* PLAYER */

.player{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.play-btn{
  width:55px;
  height:55px;
  border:none;
  border-radius:50%;
  background:#ff004c;
  color:white;
  font-size:16px;
  cursor:pointer;

  transition:.3s;

  box-shadow:
  0 0 25px rgba(255,0,90,.6);
}

.play-btn:hover{
  transform:scale(1.1);
}

.wave{
  display:flex;
  align-items:end;
  gap:4px;
  height:40px;
  flex:1;
}

.wave span{
  width:5px;
  height:10px;
  background:#ff004c;
  border-radius:20px;
}

.wave.active span{
  animation:wave .7s infinite ease-in-out;
}

.wave span:nth-child(2){
  animation-delay:.1s;
}

.wave span:nth-child(3){
  animation-delay:.2s;
}

.wave span:nth-child(4){
  animation-delay:.3s;
}

.wave span:nth-child(5){
  animation-delay:.4s;
}

@keyframes wave{

  0%{
    height:10px;
  }

  50%{
    height:35px;
  }

  100%{
    height:10px;
  }

}

/* SOCIALS */

.socials{
  display:flex;
  gap:20px;
  margin-top:40px;
}

.socials a{
  width:65px;
  height:65px;
  border-radius:50%;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,0,80,.2);

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.3s;
}

.socials a:hover{
  transform:
  translateY(-5px)
  scale(1.08);

  box-shadow:
  0 0 30px rgba(255,0,90,.4);
}

.socials img{
  width:34px;
  height:34px;
}

/* MOBILE */

@media(max-width:900px){

  body{
    cursor:auto;
  }

  .cursor,
  .smoke{
    display:none;
  }

  .logo{
    font-size:36px;
  }

  .bio{
    width:95%;
    font-size:11px;
    padding:16px;
  }

  .carousel-wrapper{
    width:260px;
  }

  .carousel{
    gap:16px;
  }

  .card{
    width:220px;
    min-width:220px;
  }

  .card img{
    height:220px;
  }

  .socials{
    gap:14px;
  }

  .socials a{
    width:55px;
    height:55px;
  }

  .socials img{
    width:28px;
    height:28px;
  }

}

</style>
</head>

<body>

<img src="giforbital.gif" class="bg-gif">

<div class="bg-glow"></div>

<div class="stars" id="stars"></div>

<div class="cursor"></div>

<div class="main">

<section class="hero">

<img
class="profile"
src="https://i.scdn.co/image/ab6761610000e5eb2fbad6f69231d3d9cb2fb58c"
/>

<h1 class="logo">
DJ ORBITAL
</h1>

<div class="bio">

DJ ORBITAL is a Brazilian phonk/funk producer.
He creates dark atmospheres, heavy basslines,
and futuristic energy, blending cyber aesthetics,
anime, and internet culture.

</div>

</section>

<!-- CAROUSEL FIXO -->

<div class="carousel-area">

<div class="carousel-wrapper">

<div class="carousel" id="carousel">

<!-- CARD 1 -->
<div class="card">
<img src="https://i.scdn.co/image/ab67616d0000b2734d8151af7b09dfa5d037b489">

<div class="music-title">MONTAGEM CAMERA LENTA</div>

<button class="play-btn" onclick="toggleMusic(this, 'cameralenta.mp3')">▶</button>
<div class="wave">
<span></span><span></span><span></span><span></span><span></span>
</div>
</div>
</div>
</div>

<!-- CARD 2 -->
<div class="card">
<img src="https://i.scdn.co/image/ab67616d0000b2737ab9130cba70140e95316245">
<div class="content">
<div class="music-title">MONTAGEM ALUCINANTE</div>
<div class="player">
<button class="play-btn" onclick="toggleMusic(this, 'alucinante.mp3')">▶</button>
<div class="wave">
<span></span><span></span><span></span><span></span><span></span>
</div>
</div>
</div>
</div>

<!-- CARD 3 -->
<div class="card">
<img src="https://i.scdn.co/image/ab67616d0000b273402ac8a6eae5d96ba7016b80">
<div class="content">
<div class="music-title">MALDITO MOVIMIENTO</div>
<div class="player">
<button class="play-btn" onclick="toggleMusic(this, 'movimiento.mp3')">▶</button>
<div class="wave">
<span></span><span></span><span></span><span></span><span></span>
</div>
</div>
</div>
</div>

<!-- CARD 4 -->
<div class="card">
<img src="https://i.scdn.co/image/ab67616d0000b273e1de0586dbed430ef75934ee">
<div class="content">
<div class="music-title">MONTAGEM SENTA DEVAGAR</div>
<div class="player">
<button class="play-btn" onclick="toggleMusic(this, 'sentadeva.mp3')">▶</button>
<div class="wave">
<span></span><span></span><span></span><span></span><span></span>
</div>
</div>
</div>
</div>

<!-- CARD 5 -->
<div class="card">
<img src="https://i.scdn.co/image/ab67616d0000b273f4714e247ad22d0f3f34129e">
<div class="content">
<div class="music-title">MONTAGEM TURBO</div>
<div class="player">
<button class="play-btn" onclick="toggleMusic(this, 'turboi.mp3')">▶</button>
<div class="wave">

</div>
</div>
</div>
</div>

</div>

<div class="socials">

<a target="_blank" href="https://open.spotify.com/intl-pt/artist/01XS19DjUcPe5dfYEkXjsg?si=CQ0B9SeHTdmI6tPjT8_R_g">

<script>

/* STARS */

const stars = document.getElementById('stars')

for(let i=0;i<180;i++){

  const star = document.createElement('div')

  star.classList.add('star')

  star.style.left = Math.random()*100 + 'vw'
  star.style.top = Math.random()*100 + 'vh'

  star.dataset.speed = Math.random()*2

  stars.appendChild(star)

}

/* CURSOR */

if(window.innerWidth > 900){

const cursor = document.querySelector('.cursor')

document.addEventListener('mousemove',(e)=>{

  cursor.style.left = e.clientX + 'px'
  cursor.style.top = e.clientY + 'px'

  const smoke = document.createElement('div')

  smoke.classList.add('smoke')

  smoke.style.left = e.clientX + 'px'
  smoke.style.top = e.clientY + 'px'

  document.body.appendChild(smoke)

  setTimeout(()=>{
    smoke.remove()
  },900)

})

}

/* AUDIO */

let currentAudio = null
let currentButton = null

function toggleMusic(button, src){

  const wave =
  button.parentElement.querySelector('.wave')

  if(
    currentAudio &&
    currentButton === button &&
    !currentAudio.paused
  ){

    currentAudio.pause()

    button.innerHTML = '▶'

    wave.classList.remove('active')

    return
  }

  if(currentAudio){

    currentAudio.pause()

    document.querySelectorAll('.play-btn')
    .forEach(btn => btn.innerHTML = '▶')

    document.querySelectorAll('.wave')
    .forEach(w => w.classList.remove('active'))

  }

  currentAudio = new Audio(src)

  currentButton = button

  currentAudio.play()

  button.innerHTML = '❚❚'

  wave.classList.add('active')

  currentAudio.onended = ()=>{

    button.innerHTML = '▶'

    wave.classList.remove('active')

  }

}

/* ===== CAROUSEL TRAVADO ===== */

const cards = document.querySelectorAll('.card')

let current = 1

function updateCarousel(){

  cards.forEach(card=>{

    card.style.display = 'none'

    card.classList.remove('active')
    card.classList.remove('side')

  })

  const left =
  (current - 1 + cards.length) % cards.length

  const center = current

  const right =
  (current + 1) % cards.length

  cards[left].style.display = 'block'
  cards[center].style.display = 'block'
  cards[right].style.display = 'block'

  cards[left].classList.add('side')
  cards[center].classList.add('active')
  cards[right].classList.add('side')

}

updateCarousel()

function nextCard(){

  current++

  if(current >= cards.length){
    current = 0
  }

  updateCarousel()

}

function prevCard(){

  current--

  if(current < 0){
    current = cards.length - 1
  }

  updateCarousel()

}

/* SCROLL */

window.addEventListener('wheel',(e)=>{

  if(e.deltaY > 0){
    nextCard()
  }else{
    prevCard()
  }

})

/* TOUCH MOBILE */

let touchStartX = 0
let touchEndX = 0

window.addEventListener('touchstart',(e)=>{

  touchStartX = e.changedTouches[0].screenX

})

window.addEventListener('touchend',(e)=>{

  touchEndX = e.changedTouches[0].screenX

  if(touchStartX - touchEndX > 40){

    nextCard()

  }

  if(touchEndX - touchStartX > 40){

    prevCard()

  }

})

</script>

</body>
</html>
